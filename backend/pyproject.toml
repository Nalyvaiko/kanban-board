[project]
name = "kanban-backend"
version = "0.1.0"
description = "In-memory REST API backend for the Mini Jira kanban board."
readme = "README.md"
authors = [
    { name = "Vitalii", email = "v.yu.nalyvaiko@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
kanban-backend = "kanban_backend:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` is meant to be called in argument defaults -
# that's how the dependency-injection system is wired up.
ignore = ["B008"]
