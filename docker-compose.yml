services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # `image:` alongside `build:` lets this one file serve both uses:
    # locally/in CI tests, `docker compose up --build` builds from
    # source and tags it as APP_IMAGE's default; in deploy-app.sh,
    # APP_IMAGE is set to a specific pushed ECR tag and `docker compose
    # pull` fetches exactly that, never building on the instance.
    image: ${APP_IMAGE:-kanban-board-app}
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://kanban:kanban@db:5432/kanban
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
