services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # `image:` alongside `build:` lets this one file serve both uses:
    # locally/in CI tests, `docker compose up --build` builds from
    # source and tags it as APP_IMAGE's default; in deploy-app.sh,
    # APP_IMAGE is set to a specific pushed ECR tag and `docker compose
    # pull` fetches exactly that, never building on the instance.
    image: ${APP_IMAGE:-kanban-board-app}
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://kanban:kanban@db:5432/kanban
      # Identify this deployment in telemetry (see
      # backend/src/kanban_backend/telemetry.py). deploy-app.sh sets
      # both of these for a real deploy; the defaults here cover local
      # `docker compose up` and the integration/e2e test stacks, which
      # never set them.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_VERSION: ${APP_VERSION:-unknown}
      # Unset by default - telemetry.py only exports spans when this is
      # set (see its own comment). To send to the (separate, optional)
      # stack in ../observability/: OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      # - a host port, not a container name, deliberately: that stack
      # is its own independent Compose project, so this one shouldn't
      # need to know its network to even start (this file has to keep
      # working standalone, e.g. in CI's integration/e2e test jobs,
      # whether or not that stack happens to be running).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # Lets OTEL_EXPORTER_OTLP_ENDPOINT above resolve host.docker.internal
    # on Linux too (Docker Desktop already does this without help).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
