name: Promote to Production

# Deliberately separate from ci-cd.yml's deploy-dev, not another job in
# that workflow: "promote" means ship the exact image dev is already
# running (already built, already pushed, already proven out by dev
# traffic) - never rebuild, and never deploy whatever main's tip
# happens to be at click-time instead. A job triggered by
# workflow_dispatch only ever sees its own trigger's ref, so it can't
# express "whatever dev is running" without a step like the one below
# that asks dev directly.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  get-dev-state:
    name: Check dev's current commit and image
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      commit_sha: ${{ steps.state.outputs.sha }}
      image: ${{ steps.state.outputs.image }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Find the dev instance and what it's currently running
        id: state
        run: |
          INSTANCE_ID=$(aws cloudformation describe-stacks --stack-name "${{ vars.AWS_STACK_NAME }}" \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)
          # shellcheck disable=SC2016
          # The $(...) below are intentionally literal - they're JSON
          # string content describing commands for the remote instance
          # to run once sent, not something this runner's shell expands.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Read dev's current commit and image for a promote-to-production run" \
            --parameters '{"commands":[
              "set -euo pipefail",
              "echo SHA=$(git -C /opt/kanban-board rev-parse HEAD)",
              "echo IMAGE=$(sed -n \"s/^APP_IMAGE=//p\" /opt/kanban-board/.env)"
            ]}' \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            if [ "$STATUS" = "Success" ]; then
              break
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "::error::Could not read dev's current state (command $STATUS) - stderr follows:"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query StandardErrorContent --output text
              exit 1
            fi
            echo "Waiting for dev's state to be readable... ($i/30)"
            sleep 5
          done
          OUTPUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text)
          SHA=$(echo "$OUTPUT" | sed -n 's/^SHA=//p' | tr -d '[:space:]')
          IMAGE=$(echo "$OUTPUT" | sed -n 's/^IMAGE=//p' | tr -d '[:space:]')
          if [ -z "$SHA" ] || [ -z "$IMAGE" ]; then
            echo "::error::Got an empty commit SHA or image reference from dev (SHA='$SHA' IMAGE='$IMAGE')"
            exit 1
          fi
          echo "Dev is running $IMAGE (commit $SHA)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Confirm dev is actually healthy right now
        run: |
          APP_URL=$(aws cloudformation describe-stacks --stack-name "${{ vars.AWS_STACK_NAME }}" \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          curl -fsS "$APP_URL/api/health"

  deploy-to-prod:
    name: Deploy dev's image to production
    runs-on: ubuntu-latest
    needs: get-dev-state
    environment: production
    permissions:
      contents: read
    steps:
      # Checks out the exact commit dev is running - not this
      # workflow's trigger ref - so the CloudFormation template used
      # below matches what's about to be deployed. The app image itself
      # is NOT rebuilt from this checkout; deploy-app.sh pulls the
      # already-pushed image dev reported above.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.get-dev-state.outputs.commit_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation stack (infrastructure)
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/template.yaml \
            --stack-name "${{ vars.AWS_STACK_NAME }}" \
            --parameter-overrides \
                VpcId="${{ vars.AWS_VPC_ID }}" \
                SubnetId="${{ vars.AWS_SUBNET_ID }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: stack
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name "${{ vars.AWS_STACK_NAME }}" --query 'Stacks[0].Outputs')
          echo "instance_id=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="InstanceId") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "app_url=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="AppUrl") | .OutputValue')" >> "$GITHUB_OUTPUT"

      - name: Wait for the SSM agent to come online
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.stack.outputs.instance_id }}" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "")
            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent online."
              exit 0
            fi
            echo "Waiting for the SSM agent to come online... ($i/30)"
            sleep 10
          done
          echo "::error::SSM agent on ${{ steps.stack.outputs.instance_id }} never came online."
          exit 1

      - name: Deploy the app code (git fetch + docker compose pull/up)
        id: deploy-command
        run: |
          SCRIPT=$(sed \
            -e "s#__GIT_SHA__#${{ needs.get-dev-state.outputs.commit_sha }}#g" \
            -e "s#__GITHUB_REPOSITORY__#${{ github.repository }}#g" \
            -e "s#__IMAGE__#${{ needs.get-dev-state.outputs.image }}#g" \
            .github/scripts/deploy-app.sh)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.stack.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --comment "Promote ${{ needs.get-dev-state.outputs.image }} to production" \
            --parameters "$(jq -n --arg script "$SCRIPT" '{commands: [$script]}')" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the deploy command to finish
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.deploy-command.outputs.command_id }}" \
              --instance-id "${{ steps.stack.outputs.instance_id }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "Deploy status: $STATUS ($i/60)"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Deploy command $STATUS - stderr follows:"
                aws ssm get-command-invocation \
                  --command-id "${{ steps.deploy-command.outputs.command_id }}" \
                  --instance-id "${{ steps.stack.outputs.instance_id }}" \
                  --query StandardErrorContent --output text
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Deploy command never finished within 10 minutes."
          exit 1

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ steps.stack.outputs.app_url }}/api/health"; then
              echo "Healthy."
              exit 0
            fi
            echo "Waiting for ${{ steps.stack.outputs.app_url }}/api/health to respond... ($i/30)"
            sleep 10
          done
          echo "::error::App never became healthy at ${{ steps.stack.outputs.app_url }}/api/health"
          exit 1
