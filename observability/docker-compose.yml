volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # Published to the host, not just this project's own network, so
      # the app stack (a separate Compose project - see ../docker-
      # compose.yml) can reach it without the two sharing a network.
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP - point OTEL_EXPORTER_OTLP_ENDPOINT here
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    # Pinned, unlike the other images here: 3.x restructured its config
    # schema around a different (scheduler/worker-based) deployment
    # model, which tempo.yaml's simple single-binary config doesn't
    # match. 2.6.1 is the last 2.x line and keeps the classic
    # ingester/compactor config this file uses.
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    environment:
      # Only matters the first time Grafana ever starts against this
      # volume - it seeds the admin user once, so changing this later
      # does nothing without resetting grafana-data too. Unset (the
      # local/default case) keeps Grafana's own admin/admin default;
      # the AWS deploy (cloudformation/observability.yaml) always sets
      # a real one, since that instance is reachable from the internet.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # So links Grafana generates itself - e.g. the dashboard link on
      # an alert notification (see grafana/provisioning/alerting/) -
      # are absolute and actually clickable from outside Grafana, not
      # just relative paths that only resolve inside its own UI. The
      # AWS deploy (cloudformation/observability.yaml) sets this to its
      # own real address instead of this localhost default.
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000" # login: admin / admin locally (forces a password change)
    depends_on:
      - prometheus
      - loki
      - tempo
