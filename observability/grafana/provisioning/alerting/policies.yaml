apiVersion: 1

# The root/default policy - there is only one alert rule in this stack
# right now, so everything routes to the one contact point rather than
# needing nested routes keyed on labels.
policies:
  - orgId: 1
    receiver: kanban-board-oncall
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
