receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Loki's own OTLP endpoint (native since Loki 3.x) rather than the
  # collector's dedicated `loki` exporter, which depends on the same
  # thing and is the less current of the two options.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

  # Pull-based: Prometheus scrapes this (see prometheus.yml), rather
  # than the collector pushing via remote-write - no special flag
  # needed on the Prometheus side this way.
  prometheus:
    endpoint: 0.0.0.0:8889
    # Without this, deployment.environment/service.version (and
    # service.name) only show up on the separate `target_info` metric,
    # not on boards_created_total etc. themselves - which makes
    # filtering by them in Grafana (see grafana/provisioning/
    # dashboards/) a join instead of a plain label match. With it,
    # every resource attribute becomes a label on every metric
    # directly.
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
